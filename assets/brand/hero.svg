<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lorekeeper — a local-first writing studio for novelists">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1A14"/>
      <stop offset="100%" stop-color="#0E0B07"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#B8642E" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#B8642E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#B8642E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A89676" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#warm)"/>

  <!-- Orbit mark -->
  <g transform="translate(110 60)">
    <ellipse cx="100" cy="100" rx="96" ry="28" fill="none" stroke="#A89676" stroke-width="1.4" stroke-opacity="0.5" transform="rotate(-18 100 100)"/>
    <ellipse cx="100" cy="100" rx="64" ry="18" fill="none" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.55" transform="rotate(22 100 100)"/>
    <circle cx="36" cy="46" r="1.4" fill="#F5EBD9" fill-opacity="0.65"/>
    <circle cx="172" cy="58" r="1" fill="#F5EBD9" fill-opacity="0.55"/>
    <circle cx="50" cy="168" r="1.1" fill="#F5EBD9" fill-opacity="0.45"/>
    <circle cx="186" cy="152" r="0.9" fill="#F5EBD9" fill-opacity="0.45"/>
    <circle cx="100" cy="100" r="44" fill="#B8642E"/>
    <circle cx="86" cy="86" r="12" fill="#E8A24F" fill-opacity="0.55"/>
    <circle cx="170" cy="124" r="5" fill="#F5EBD9"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="155" font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif" font-size="62" fill="#F5EBD9" font-weight="500" letter-spacing="6">LOREKEEPER</text>

  <!-- Accent rule -->
  <line x1="360" y1="175" x2="500" y2="175" stroke="#B8642E" stroke-width="2"/>

  <!-- Tagline -->
  <text x="362" y="208" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#A89676" letter-spacing="2.5">A LOCAL-FIRST WRITING STUDIO FOR NOVELISTS</text>

  <!-- Module hint -->
  <text x="362" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7A6F5F" letter-spacing="1.8">CODEX  ·  MANUSCRIPT  ·  WRITERS' ROOM  ·  DE-SLOP  ·  TIMELINE</text>
</svg>
