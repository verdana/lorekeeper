  <text x="78" y="640" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#7A6F5F" letter-spacing="0.5">The Emberwright's Covenant</text>

  <!-- Main area: Chapter editor -->
  <g transform="translate(296 116)">
    <!-- Top bar / breadcrumb -->
    <text x="0" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#7A6F5F" letter-spacing="0.8">VOLUME 1 · THE ROAD TO ASHFELD · CHAPTER 3</text>

    <!-- Chapter title -->
    <text x="0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F5EBD9" font-weight="500">The Lantern at the Gate</text>

    <!-- Toolbar -->
    <g transform="translate(0 76)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#2D2218"/>
      <text x="30" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F5EBD9" text-anchor="middle">Save</text>
      <rect x="68" y="0" width="60" height="22" rx="4" fill="#221A12" stroke="#3B2F24" stroke-width="1"/>
      <text x="98" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#A89676" text-anchor="middle">Zen</text>
      <rect x="136" y="0" width="120" height="22" rx="4" fill="#221A12" stroke="#3B2F24" stroke-width="1"/>
      <text x="196" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#A89676" text-anchor="middle">AI actions ▾</text>
    </g>

    <!-- Prose body (faked) -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#D9C9A8">
      <text x="0" y="138">The first snow of autumn fell as Maren reached the gate — not</text>
      <text x="0" y="160">the slow, weightless drift she remembered from the foothills,</text>
      <text x="0" y="182">but a thin cold dust that settled on her cloak and refused to</text>
      <text x="0" y="204">melt. She had walked for three days to be here, and the city</text>
      <text x="0" y="226">looked back at her with the polite indifference of a place that</text>
      <text x="0" y="248">had seen a thousand strangers come begging for a second look.</text>
      <text x="0" y="270"></text>
      <text x="0" y="292">A single lantern hung above the gate, its flame so steady it</text>
      <text x="0" y="314">seemed painted there. She counted the syllables of her own</text>
      <text x="0" y="336">name against the wind and decided she was not afraid.</text>
    </g>

    <!-- Highlighted "AI-flavored" sentence (de-slop hint) -->
    <rect x="0" y="220" width="540" height="22" rx="3" fill="#B8642E" fill-opacity="0.12"/>
    <line x1="0" y1="220" x2="0" y2="242" stroke="#B8642E" stroke-width="2"/>

    <!-- Floating de-slop hint -->
    <g transform="translate(580 200)">
      <rect x="0" y="0" width="220" height="64" rx="6" fill="#221A12" stroke="#3B2F24" stroke-width="1"/>
      <text x="12" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#B8642E" letter-spacing="0.8">DE-SLOP · 0.42 RISK</text>
      <text x="12" y="40" font-family="Georgia, serif" font-size="11" fill="#D9C9A8">had seen a thousand strangers</text>
      <text x="12" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#7A6F5F">parallelism · idiomDensity</text>
    </g>

